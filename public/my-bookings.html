<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lịch đặt của tôi | Sport Booking</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/api.js" defer></script>
    <script src="/js/my-bookings.js" defer></script>
  </head>
  <body>
    <main class="my-bookings-page">
      <h1>Lịch đặt của tôi</h1>
      <p id="bookings-message" class="form-message" role="status" aria-live="polite"></p>
      <section class="booking-list-section">
        <h2>Sắp tới</h2>
        <div id="upcoming-bookings" class="booking-list" aria-live="polite">Đang tải lượt đặt...</div>
      </section>
      <section class="booking-list-section">
        <h2>Đã qua</h2>
        <div id="past-bookings" class="booking-list" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>
